services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: theme_engine
      POSTGRES_USER: theme
      POSTGRES_PASSWORD: theme
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theme -d theme_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Sprint U1 Task 7: single-container self-host, opt-in via
  # `docker compose --profile full up`. Both services build the same image
  # (CONTENTLOOP_ROLE picks api vs worker in scripts/docker-entrypoint.sh) and talk
  # to postgres/redis over the compose network, so the DSNs use the service
  # names as hostnames rather than the host-mapped ports above (55432/6379).
  app-api:
    build: .
    profiles: ["full"]
    environment:
      - DATABASE_URL=postgres://theme:theme@postgres:5432/theme_engine
      - REDIS_URL=redis://redis:6379
      - CONTENTLOOP_ROLE=api
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-worker:
    build: .
    profiles: ["full"]
    environment:
      - DATABASE_URL=postgres://theme:theme@postgres:5432/theme_engine
      - REDIS_URL=redis://redis:6379
      - CONTENTLOOP_ROLE=worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
